name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, feature/temporary-wallpaper-app]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all py7zr --collect-all cv2 --hidden-import cv2.dnn_superres --name TemporaryWallpaper app.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: TemporaryWallpaper-Windows
          path: dist/TemporaryWallpaper.exe
          if-no-files-found: error
